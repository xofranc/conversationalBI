# ConversationalBI — stack completo
#
# Arquitectura real (migración 31/07/2026):
#   - Django sirve la API con gunicorn y persiste en SQLite local
#     (Postgres/Supabase llega con las env vars de la Fase 2).
#   - Caché **LocMem** (el código no usa Redis).
#   - El motor IA corre en-proceso contra una API OpenAI-compatible
#     (OpenCode Go por defecto; Groq/OpenRouter = cambiar env vars).
#     Ya no hay servicio Ollama.
#
# Uso:
#   cp backend/.env.example backend/.env   # primera vez (rellenar LLM_API_KEY)
#   docker compose up --build

services:
  django:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,django
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media        # uploads de datasets persisten
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"                    # nginx: SPA + proxy /api → django
    depends_on:
      django:
        condition: service_healthy

volumes:
  media_data:
