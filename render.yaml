# Blueprint de Render — Fase 3 del PLAN_MIGRACION.md
#
# Uso: dashboard.render.com → New → Blueprint → conectar este repo.
# Render crea el servicio con todo esto configurado y solo pide los
# valores de las env vars marcadas con `sync: false` (secretos).
#
# Tras el deploy: anotar la URL https://conversationalbi-api.onrender.com
# para el VITE_API_URL del frontend (Vercel), y actualizar aquí
# CORS_ALLOWED_ORIGINS con la URL que asigne Vercel.

services:
  - type: web
    name: conversationalbi-api
    runtime: python
    rootDir: backend
    plan: free
    region: ohio            # US-East: misma zona que Supabase us-east-2 (baja latencia a la BD)
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 2 --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true # Render genera uno seguro
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # URLs permanentes del proyecto en Vercel (las preview con hash
      # aleatorio cambian en cada deploy, no se whitelistean).
      - key: CORS_ALLOWED_ORIGINS
        value: https://conversational-bi-eight.vercel.app
      # Secretos: Render los pide al aplicar el blueprint.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_READER_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: LLM_SQL_MODEL
        value: kimi-k2.7-code
      - key: LLM_ANSWER_MODEL
        value: mimo-v2.5
      - key: LLM_TIMEOUT
        value: "60"
      - key: SUPABASE_URL
        sync: false
