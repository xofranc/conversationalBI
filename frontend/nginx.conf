server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La SPA y la API comparten origen: el navegador llama a /api/*
    # y nginx lo reenvía al servicio django de la red interna.
    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;   # uploads de hasta 50 MB + overhead multipart
        # Las consultas SQL pasan por el LLM local (lento en CPU en frío)
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
